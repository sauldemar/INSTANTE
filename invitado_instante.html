<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Instante · Tu fotografía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d0d0b;
  --ink-muted: #7a7a72;
  --ink-hint: #b0b0a6;
  --paper: #faf9f6;
  --paper-warm: #f3f1ec;
  --paper-deep: #e8e5de;
  --gold: #c9a84c;
  --border: rgba(13,13,11,0.1);
  --border-strong: rgba(13,13,11,0.22);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html,body { height:100%; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.wrap {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  background: var(--paper);
  display: flex;
  flex-direction: column;
}

@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
@keyframes spin { to { transform:rotate(360deg); } }

.screen { display:none; flex-direction:column; flex:1; animation:fadeUp 0.28s ease; }
.screen.active { display:flex; }

/* HEADER */
.hdr {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.brand { font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; }
.brand-dot { color:var(--gold); }
.event-lbl { font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-muted); }

/* PHOTO HERO */
.photo-hero { position:relative; background:var(--paper-deep); flex-shrink:0; overflow:hidden; }
.photo-hero img { width:100%; max-height:55vh; object-fit:cover; display:block; }
.photo-hero-overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(13,13,11,0.45) 0%,transparent 55%); }
.photo-hero-meta { position:absolute; bottom:16px; left:20px; }
.photo-hero-id { font-family:'DM Sans',sans-serif; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.75); }

/* CONTENT */
.content { padding:24px; display:flex; flex-direction:column; gap:14px; flex:1; }
.content-title { font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:300; letter-spacing:-0.3px; }
.content-sub { font-size:12px; color:var(--ink-muted); line-height:1.6; margin-top:-4px; }

.btn-main {
  background:var(--ink); color:var(--paper); border:none; border-radius:12px;
  padding:15px; font-size:12px; font-weight:500; letter-spacing:0.1em;
  text-transform:uppercase; font-family:'DM Sans',sans-serif;
  width:100%; cursor:pointer; transition:opacity 0.15s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-main:active { opacity:0.8; }
.btn-outline {
  background:transparent; color:var(--ink); border:1px solid var(--border-strong);
  border-radius:12px; padding:13px; font-size:12px; letter-spacing:0.08em;
  text-transform:uppercase; font-family:'DM Sans',sans-serif;
  width:100%; cursor:pointer; transition:background 0.15s;
  display:flex; align-items:center; justify-content:center; gap:7px;
}
.btn-outline:active { background:var(--paper-warm); }
.btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

/* VERSIONS */
.versions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.ver-label { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-hint); margin-bottom:6px; font-weight:500; }
.ver-thumb { border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--paper-deep); }
.ver-thumb canvas { width:100%; display:block; }
.ver-normal .ver-thumb { aspect-ratio:3/4; }
.ver-stories .ver-thumb { aspect-ratio:9/16; }

/* LOADING */
.loading-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:40px; }
.spinner { width:36px; height:36px; border:1.5px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; }
.loading-title { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:300; }
.loading-sub { font-size:11px; color:var(--ink-muted); letter-spacing:0.05em; }

/* ERROR */
.error-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:40px; text-align:center; }
.error-title { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:300; color:var(--ink-muted); }
.error-sub { font-size:12px; color:var(--ink-hint); }

/* DOTS */
.dots { display:flex; justify-content:center; gap:5px; padding:14px; flex-shrink:0; border-top:1px solid var(--border); }
.dot { width:5px; height:5px; border-radius:50%; background:var(--border-strong); transition:all 0.25s; }
.dot.on { background:var(--ink); width:16px; border-radius:3px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- CARGANDO -->
  <div class="screen active" id="s-loading">
    <div class="hdr">
      <div class="brand">Inst<span class="brand-dot">a</span>nte</div>
    </div>
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-title">Cargando tu foto...</div>
      <div class="loading-sub">Un momento por favor</div>
    </div>
  </div>

  <!-- S1: VER FOTO -->
  <div class="screen" id="s1">
    <div class="hdr">
      <div class="brand">Inst<span class="brand-dot">a</span>nte</div>
      <div class="event-lbl" id="ev1"></div>
    </div>
    <div class="photo-hero">
      <img id="photo-original" src="" alt="">
      <div class="photo-hero-overlay"></div>
      <div class="photo-hero-meta"><div class="photo-hero-id" id="pid1"></div></div>
    </div>
    <div class="content">
      <div>
        <div class="content-title">¡Aquí está<br>tu fotografía!</div>
        <div class="content-sub" id="ev-sub1">Tu recuerdo del evento</div>
      </div>
      <div style="flex:1"></div>
      <div id="result-section" style="display:none">
        <div class="versions" style="margin-bottom:14px">
          <div class="ver-normal">
            <div class="ver-label">Foto con fondo</div>
            <div class="ver-thumb"><canvas id="c-normal"></canvas></div>
          </div>
          <div class="ver-stories">
            <div class="ver-label">Para Stories</div>
            <div class="ver-thumb"><canvas id="c-stories"></canvas></div>
          </div>
        </div>
      </div>
      <button class="btn-main" onclick="downloadNormal()">⬇ Guardar en galería</button>
      <div class="btn-grid">
        <button class="btn-outline" onclick="downloadStories()">Stories</button>
        <button class="btn-outline" onclick="shareIG()">Instagram</button>
      </div>
      <button onclick="downloadOriginal()" style="background:none;border:none;cursor:pointer;color:var(--ink-hint);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;padding:4px;text-align:center;font-family:DM Sans,sans-serif">
        Descargar foto original (fondo blanco)
      </button>
    </div>
  </div>

  <!-- ERROR -->
  <div class="screen" id="s-error">
    <div class="hdr"><div class="brand">Inst<span class="brand-dot">a</span>nte</div></div>
    <div class="error-wrap">
      <div class="error-title">Foto no encontrada</div>
      <div class="error-sub" id="error-msg">El enlace puede haber expirado.</div>
    </div>
  </div>

  <div class="dots">
    <div class="dot on" id="dot1"></div>
    <div class="dot" id="dot2"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://egvtxhtfgkwfyirklkbn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVndnR4aHRmZ2t3Znlpcmtsa2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNDM4NTksImV4cCI6MjA5NDcxOTg1OX0.kQ5q1nKAQ847Pm_7jsZ9-NVGKg3xRoqGpUC-PasQqQc';
const BUCKET = 'fotos-eventos';
const REMOVEBG_KEY = 'Pn97CAuXy7uWwkYvzVx8YyGs';

var photoData = null;
var processedNormal = null;
var processedStories = null;

var DEFAULT_BGS = [
  { name:'Jardín floral', gradient:['#b8d4a8','#8fbb7a'] },
  { name:'Cielo dorado', gradient:['#f5dfa0','#e8c96a'] },
  { name:'Mármol blanco', gradient:['#f0eeea','#ddd9d0'] },
];

function goScreen(n) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(n).classList.add('active');
}

function showError(msg) {
  goScreen('s-error');
  if (msg) document.getElementById('error-msg').textContent = msg;
}

async function init() {
  var params = new URLSearchParams(window.location.search);
  var photoId = params.get('foto');
  var bgIdx = parseInt(params.get('bg') || '0');

  if (!photoId) { showError('No se especificó ninguna fotografía.'); return; }

  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/fotos?id=eq.' + photoId + '&select=*', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    const data = await r.json();
    if (!data || !data.length) { showError('Esta fotografía no existe o el enlace expiró.'); return; }
    photoData = data[0];

    var eventLabel = photoData.event_id.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
    document.getElementById('ev1').textContent = eventLabel;
    document.getElementById('ev-sub1').textContent = eventLabel;
    document.getElementById('pid1').textContent = '#' + photoData.id;

    var photoUrl = SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/' + photoData.storage_path;
    document.getElementById('photo-original').src = photoUrl;

    goScreen('s1');

    var bgs = DEFAULT_BGS;
    if (photoData.backgrounds) { try { bgs = JSON.parse(photoData.backgrounds); } catch(e){} }

    var bg = bgs[bgIdx] || bgs[0];
    var colors = bg.gradient || [bg.color, bg.color];

    processPhoto(photoUrl, colors[0], colors[1]);

  } catch(e) {
    showError('Error de conexión. Verifica tu internet.');
  }
}

async function processPhoto(photoUrl, color1, color2) {
  try {
    const photoRes = await fetch(photoUrl);
    const photoBlob = await photoRes.blob();

    const formData = new FormData();
    formData.append('image_file', photoBlob, 'photo.jpg');
    formData.append('size', 'auto');

    const rbRes = await fetch('https://api.remove.bg/v1.0/removebg', {
      method: 'POST',
      headers: { 'X-Api-Key': REMOVEBG_KEY },
      body: formData
    });

    if (!rbRes.ok) return;
    const subjectBlob = await rbRes.blob();

    var img = new Image();
    img.onload = function() {
      var cn = document.getElementById('c-normal');
      cn.width = img.width; cn.height = img.height;
      var ctxN = cn.getContext('2d');
      var gN = ctxN.createLinearGradient(0,0,0,img.height);
      gN.addColorStop(0,color1); gN.addColorStop(1,color2);
      ctxN.fillStyle = gN; ctxN.fillRect(0,0,cn.width,cn.height);
      ctxN.drawImage(img, 0, 0);
      processedNormal = cn;

      var cs = document.getElementById('c-stories');
      var sw = img.width; var sh = Math.round(sw*16/9);
      cs.width = sw; cs.height = sh;
      var ctxS = cs.getContext('2d');
      var gS = ctxS.createLinearGradient(0,0,0,sh);
      gS.addColorStop(0,color1); gS.addColorStop(1,color2);
      ctxS.fillStyle=gS; ctxS.fillRect(0,0,sw,sh);
      var scale=Math.min(sw/img.width,sh*0.84/img.height);
      var dw=Math.round(img.width*scale),dh=Math.round(img.height*scale);
      var dx=Math.round((sw-dw)/2),dy=Math.round(sh*0.06);
      ctxS.drawImage(img,dx,dy,dw,dh);
      processedStories = cs;

      document.getElementById('result-section').style.display = 'block';
    };
    img.src = URL.createObjectURL(subjectBlob);

  } catch(e) {
    console.log('Process error:', e);
  }
}

function downloadNormal() {
  if (!processedNormal) { downloadOriginal(); return; }
  var a = document.createElement('a');
  a.download = 'instante-foto.png';
  a.href = processedNormal.toDataURL('image/png');
  a.click();
}

function downloadStories() {
  if (!processedStories) return;
  var a = document.createElement('a');
  a.download = 'instante-stories.png';
  a.href = processedStories.toDataURL('image/png');
  a.click();
}

function downloadOriginal() {
  if (!photoData) return;
  var a = document.createElement('a');
  a.href = SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/' + photoData.storage_path;
  a.download = 'instante-original.jpg';
  a.target = '_blank';
  a.click();
}

function shareIG() {
  if (processedStories && navigator.share) {
    processedStories.toBlob(function(blob) {
      var file = new File([blob],'instante-stories.png',{type:'image/png'});
      navigator.share({files:[file],title:'Mi foto · Instante'}).catch(function(){});
    });
  } else {
    alert('Guarda la foto primero y ábrela desde tu galería para compartir en Instagram.');
  }
}

init();
</script>
</body>
</html>
