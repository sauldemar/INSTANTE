<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operador · Un Instante Eterno</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background:#1B1C1C; color:#F2EDE4; min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.card {
  background:#252625; border-radius:20px; padding:40px;
  width:100%; max-width:560px; text-align:center;
  border:1px solid rgba(242,237,228,0.1);
}
h1 { font-size:26px; margin-bottom:6px; letter-spacing:1px; }
.event { color:#C9A24B; font-size:15px; margin-bottom:32px; letter-spacing:1px; }
.drop {
  border:2px dashed rgba(242,237,228,0.25); border-radius:16px;
  padding:50px 20px; cursor:pointer; transition:.2s; margin-bottom:24px;
}
.drop:hover { border-color:#C9A24B; background:rgba(201,162,75,0.05); }
.drop.busy { opacity:.5; pointer-events:none; }
.drop .ico { font-size:52px; margin-bottom:14px; }
.drop .txt { font-size:17px; color:rgba(242,237,228,0.8); }
.drop .hint { font-size:13px; color:rgba(242,237,228,0.45); margin-top:8px; }
input[type=file] { display:none; }
.status { min-height:26px; font-size:15px; margin-bottom:18px; }
.status.ok { color:#7A8B6F; }
.status.err { color:#e07a5f; }
.status.load { color:#C9A24B; }
.preview { display:none; margin-bottom:20px; }
.preview img { max-width:100%; border-radius:12px; max-height:280px; }
.counter {
  font-size:13px; color:rgba(242,237,228,0.45);
  border-top:1px solid rgba(242,237,228,0.1); padding-top:18px;
}
.counter b { color:#C9A24B; font-size:20px; }
</style>
</head>
<body>
<div class="card">
  <h1>Un Instante Eterno</h1>
  <div class="event" id="eventName">Esmeralda &amp; Erwin</div>

  <div class="drop" id="drop">
    <div class="ico">&#128247;</div>
    <div class="txt">Toca para subir la foto</div>
    <div class="hint">o arrastra la imagen aqui</div>
  </div>
  <input type="file" id="file" accept="image/*">

  <div class="status" id="status"></div>
  <div class="preview" id="preview"><img id="previewImg"></div>

  <div class="counter">Fotos subidas: <b id="count">0</b></div>
</div>

<script>
const SUPABASE_URL = 'https://egvtxhtfgkwfyirklkbn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVndnR4aHRmZ2t3Znlpcmtsa2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNDM4NTksImV4cCI6MjA5NDcxOTg1OX0.kQ5q1nKAQ847Pm_7jsZ9-NVGKg3xRoqGpUC-PasQqQc';
const BUCKET = 'fotos-eventos';
const EVENT_ID = 'esmeralda-erwin-2026';

const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('count');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');

let count = 0;

drop.addEventListener('click', function(){ fileInput.click(); });
drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.style.borderColor = '#C9A24B'; });
drop.addEventListener('dragleave', function(){ drop.style.borderColor = ''; });
drop.addEventListener('drop', function(e){
  e.preventDefault();
  drop.style.borderColor = '';
  if (e.dataTransfer.files[0]) subir(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function(e){
  if (e.target.files[0]) subir(e.target.files[0]);
});

function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + (type || '');
}

async function subir(file) {
  drop.classList.add('busy');
  setStatus('Subiendo foto...', 'load');

  try {
    const stamp = Date.now();
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const storagePath = EVENT_ID + '/originales/' + stamp + '.' + ext;

    const upRes = await fetch(
      SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + encodeURI(storagePath),
      {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': file.type || 'image/jpeg',
          'x-upsert': 'true'
        },
        body: file
      }
    );
    if (!upRes.ok) throw new Error('Error al subir: ' + (await upRes.text()).slice(0,120));

    const insRes = await fetch(SUPABASE_URL + '/rest/v1/fotos', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        event_id: EVENT_ID,
        storage_path: storagePath,
        scanned: false,
        ai_status: 'pending'
      })
    });
    if (!insRes.ok) throw new Error('Error en base de datos');
    const arr = await insRes.json();
    const foto = arr[0];

    previewImg.src = URL.createObjectURL(file);
    preview.style.display = 'block';

    count++;
    countEl.textContent = count;
    setStatus('Foto lista. El iPad ya muestra el QR.', 'ok');

    fetch('/api/ai-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fotoId: foto.id, storagePath: storagePath })
    }).catch(function(){});

  } catch (err) {
    setStatus('Error: ' + err.message, 'err');
  } finally {
    drop.classList.remove('busy');
    fileInput.value = '';
  }
}
</script>
</body>
</html>
