<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Operador · Foto Eventos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e8e6e0;
    --border-strong: #c8c5bc;
    --text: #1a1917;
    --text-muted: #6b6860;
    --text-hint: #9e9b93;
    --accent: #1a1917;
    --accent-fg: #ffffff;
    --success: #2d6a4f;
    --success-bg: #d8f3dc;
    --warning-bg: #fff3cd;
    --warning: #856404;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .event-badge {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 14px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
  }
  .tab.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  .main { max-width: 1000px; margin: 0 auto; padding: 24px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .stat-num { font-size: 28px; font-weight: 500; letter-spacing: -1px; }
  .stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.06em; }

  .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  .drop-zone {
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--surface);
  }
  .drop-zone:hover, .drop-zone.drag { border-color: var(--accent); background: var(--bg); }
  .drop-icon { font-size: 40px; margin-bottom: 12px; }
  .drop-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .drop-sub { font-size: 13px; color: var(--text-muted); }
  .drop-hint { font-size: 11px; color: var(--text-hint); margin-top: 8px; }

  .loading-state { display: none; }
  .spinner {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .detail-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: fadeIn 0.2s ease;
  }
  .detail-photo {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
    background: var(--bg);
  }
  .detail-body { padding: 18px; }
  .detail-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .photo-id { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; }
  .status-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .status-wait { background: var(--warning-bg); color: var(--warning); }
  .status-done { background: var(--success-bg); color: var(--success); }

  .qr-section { display: flex; justify-content: center; margin-bottom: 14px; }
  .qr-wrapper {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: inline-block;
  }
  .link-row {
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .link-text {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 16px;
    padding: 2px;
    display: flex;
    align-items: center;
    transition: color 0.15s;
  }
  .icon-btn:hover { color: var(--text); }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    width: 100%;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-bottom: 8px;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    width: 100%;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-secondary:hover { background: var(--bg); }

  .recent-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin: 18px 0 10px; }
  .recent-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .thumb {
    aspect-ratio: 3/4;
    border-radius: 8px;
    overflow: hidden;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative;
    background: var(--bg);
  }
  .thumb:hover { border-color: var(--border-strong); }
  .thumb.active { border-color: var(--accent); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-badge {
    position: absolute;
    bottom: 4px;
    left: 4px;
    right: 4px;
    text-align: center;
    font-size: 9px;
    font-weight: 500;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .thumb-wait { background: rgba(255,255,255,0.85); color: var(--text-muted); }
  .thumb-done { background: rgba(45,106,79,0.85); color: #fff; }

  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .gallery-empty { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
  .gallery-empty-icon { font-size: 48px; margin-bottom: 12px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--accent);
    color: var(--accent-fg);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    transition: transform 0.3s ease;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .error-banner {
    background: #fee2e2;
    border: 1px solid #fca5a5;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 12px;
    color: #991b1b;
    margin-bottom: 12px;
    display: none;
  }

  #view-gallery { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">📷 Foto Eventos</div>
    <div class="event-badge" id="event-name">Cargando evento...</div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-upload" onclick="switchTab('upload')">Subir foto</button>
    <button class="tab" id="tab-gallery" onclick="switchTab('gallery')">Galería (<span id="gallery-count">0</span>)</button>
  </div>
</div>

<div class="main">
  <div class="stats">
    <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-lbl">Fotos tomadas</div></div>
    <div class="stat"><div class="stat-num" id="s-scanned">0</div><div class="stat-lbl">QR escaneados</div></div>
    <div class="stat"><div class="stat-num" id="s-pending">0</div><div class="stat-lbl">Pendientes</div></div>
  </div>

  <div id="view-upload">
    <div class="upload-grid">
      <div>
        <div
          class="drop-zone"
          id="drop-zone"
          onclick="document.getElementById('file-input').click()"
          ondragover="event.preventDefault();this.classList.add('drag')"
          ondragleave="this.classList.remove('drag')"
          ondrop="handleDrop(event)"
        >
          <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
          <div id="drop-content">
            <div class="drop-icon">📸</div>
            <div class="drop-title">Subir foto del invitado</div>
            <div class="drop-sub">Arrastra aquí o haz clic para seleccionar</div>
            <div class="drop-hint">JPG, PNG, HEIC · Máx 20MB</div>
          </div>
          <div id="drop-loading" class="loading-state">
            <div class="spinner"></div>
            <div class="drop-sub">Subiendo a Supabase...</div>
          </div>
        </div>

        <div id="recent-wrap" style="display:none">
          <div class="recent-label">Últimas fotos del evento</div>
          <div class="recent-grid" id="recent-grid"></div>
        </div>
      </div>

      <div id="detail-panel"></div>
    </div>
  </div>

  <div id="view-gallery">
    <div id="gallery-empty-state" class="gallery-empty">
      <div class="gallery-empty-icon">🖼️</div>
      <div style="font-size:15px;font-weight:500;margin-bottom:6px">Sin fotos aún</div>
      <div style="font-size:13px">Sube la primera foto para comenzar</div>
    </div>
    <div id="gallery-photos" class="gallery-grid" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://egvtxhtfgkwfyirklkbn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVndnR4aHRmZ2t3Znlpcmtsa2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNDM4NTksImV4cCI6MjA5NDcxOTg1OX0.kQ5q1nKAQ847Pm_7jsZ9-NVGKg3xRoqGpUC-PasQqQc';
const BUCKET = 'fotos-eventos';
const EVENT_ID = 'fatima-ethan-2026';
const GUEST_BASE_URL = window.location.origin + '/invitado.html';

var photos = [];
var selectedId = null;

function supaHeaders() {
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };
}

async function initSupabase() {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/fotos?select=*&event_id=eq.' + EVENT_ID + '&order=created_at.desc', {
      headers: supaHeaders()
    });
    if (r.ok) {
      const data = await r.json();
      photos = data.map(function(p) {
        return {
          id: p.id,
          url: SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/' + p.storage_path,
          time: new Date(p.created_at).toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit'}),
          scanned: p.scanned,
          storagePath: p.storage_path
        };
      });
      updateStats();
      renderRecent();
      if (photos.length > 0) {
        selectedId = photos[0].id;
        renderDetail(photos[0]);
      }
    }
  } catch(e) {
    console.log('Iniciando en modo local:', e.message);
  }
  document.getElementById('event-name').textContent = 'Fátima & Ethan · 30 Mayo 2026';
}

async function compressImage(file) {
  return new Promise(function(resolve) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function() {
      var maxW = 1800, maxH = 1800;
      var w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        var ratio = Math.min(maxW/w, maxH/h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob) {
        URL.revokeObjectURL(url);
        resolve(blob);
      }, 'image/jpeg', 0.88);
    };
    img.src = url;
  });
}

async function uploadToSupabase(file) {
  var compressed = await compressImage(file);
  const ext = 'jpg';
  const path = EVENT_ID + '/' + Date.now() + '_' + Math.random().toString(36).substr(2,6) + '.' + ext;

  const uploadRes = await fetch(SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'image/jpeg',
      'x-upsert': 'false'
    },
    body: compressed
  });

  if (!uploadRes.ok) {
    const err = await uploadRes.text();
    throw new Error('Error subiendo imagen: ' + err);
  }

  const photoId = generateId();
  const insertRes = await fetch(SUPABASE_URL + '/rest/v1/fotos', {
    method: 'POST',
    headers: { ...supaHeaders(), 'Prefer': 'return=representation' },
    body: JSON.stringify({
      id: photoId,
      event_id: EVENT_ID,
      storage_path: path,
      scanned: false
    })
  });

  if (!insertRes.ok) {
    const err = await insertRes.text();
    throw new Error('Error guardando en BD: ' + err);
  }

  return { id: photoId, path: path };
}

async function markScannedInDB(photoId) {
  await fetch(SUPABASE_URL + '/rest/v1/fotos?id=eq.' + photoId, {
    method: 'PATCH',
    headers: { ...supaHeaders(), 'Prefer': 'return=minimal' },
    body: JSON.stringify({ scanned: true })
  });
}

function generateId() {
  return Math.random().toString(36).substr(2, 8).toUpperCase();
}

function updateStats() {
  const scanned = photos.filter(function(p){ return p.scanned; }).length;
  document.getElementById('s-total').textContent = photos.length;
  document.getElementById('s-scanned').textContent = scanned;
  document.getElementById('s-pending').textContent = photos.length - scanned;
  document.getElementById('gallery-count').textContent = photos.length;
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) handleFile(f);
}

async function handleFile(file) {
  if (!file) return;
  document.getElementById('drop-content').style.display = 'none';
  document.getElementById('drop-loading').style.display = 'block';
  document.getElementById('drop-loading').querySelector('.drop-sub').textContent = 'Subiendo a Supabase...';

  try {
    const result = await uploadToSupabase(file);
    const url = URL.createObjectURL(file);
    const now = new Date();
    const time = now.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
    const photo = {
      id: result.id,
      url: url,
      time: time,
      scanned: false,
      storagePath: result.path
    };
    photos.unshift(photo);
    selectedId = result.id;
    updateStats();
    renderRecent();
    renderDetail(photo);
    showToast('✓ Foto subida correctamente');
  } catch(err) {
    showToast('⚠ ' + err.message);
  } finally {
    document.getElementById('drop-content').style.display = 'block';
    document.getElementById('drop-loading').style.display = 'none';
    document.getElementById('file-input').value = '';
  }
}

function renderDetail(photo) {
  const guestUrl = GUEST_BASE_URL + '?foto=' + photo.id;
  const panel = document.getElementById('detail-panel');
  panel.innerHTML = '<div class="detail-card" id="card-' + photo.id + '">'
    + '<img src="' + photo.url + '" class="detail-photo" alt="Foto invitado">'
    + '<div class="detail-body">'
    + '<div class="detail-meta">'
    + '<span class="photo-id">#' + photo.id + ' · ' + photo.time + '</span>'
    + '<span class="status-badge ' + (photo.scanned ? 'status-done' : 'status-wait') + '" id="badge-' + photo.id + '">'
    + (photo.scanned ? '✓ Escaneado' : 'En espera') + '</span>'
    + '</div>'
    + '<div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Muéstrale este QR al invitado</div>'
    + '<div class="qr-section"><div class="qr-wrapper" id="qr-' + photo.id + '"></div></div>'
    + '<div class="link-row">'
    + '<span class="link-text">' + guestUrl + '</span>'
    + '<button class="icon-btn" onclick="copyLink(\'' + guestUrl + '\',\'' + photo.id + '\')" title="Copiar link">📋</button>'
    + '</div>'
    + (photo.scanned ? '' : '<button class="btn-primary" onclick="markScanned(\'' + photo.id + '\')">✓ Marcar como escaneado</button>')
    + '<button class="btn-secondary" onclick="nextGuest()">📸 Siguiente invitado</button>'
    + '</div></div>';

  setTimeout(function() {
    const qrEl = document.getElementById('qr-' + photo.id);
    if (qrEl) {
      new QRCode(qrEl, {
        text: guestUrl,
        width: 140,
        height: 140,
        colorDark: '#1a1917',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  }, 100);
}

function renderRecent() {
  const wrap = document.getElementById('recent-wrap');
  const grid = document.getElementById('recent-grid');
  if (photos.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  grid.innerHTML = '';
  photos.slice(0, 8).forEach(function(p) {
    const d = document.createElement('div');
    d.className = 'thumb' + (p.id === selectedId ? ' active' : '');
    d.onclick = function() { selectedId = p.id; renderDetail(p); renderRecent(); };
    d.innerHTML = '<img src="' + p.url + '" alt="thumb"><div class="thumb-badge ' + (p.scanned ? 'thumb-done' : 'thumb-wait') + '">' + (p.scanned ? '✓' : '···') + '</div>';
    grid.appendChild(d);
  });
}

async function markScanned(photoId) {
  try {
    await markScannedInDB(photoId);
  } catch(e) { console.log('DB update failed, updating locally'); }
  const p = photos.find(function(x){ return x.id === photoId; });
  if (p) { p.scanned = true; updateStats(); renderRecent(); renderDetail(p); }
  showToast('✓ Marcado como escaneado');
}

function nextGuest() {
  selectedId = null;
  document.getElementById('detail-panel').innerHTML = '';
  renderRecent();
}

function copyLink(url, id) {
  if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function(){});
  showToast('Link copiado al portapapeles');
}

function switchTab(tab) {
  document.getElementById('tab-upload').className = 'tab' + (tab==='upload'?' active':'');
  document.getElementById('tab-gallery').className = 'tab' + (tab==='gallery'?' active':'');
  document.getElementById('view-upload').style.display = tab==='upload'?'block':'none';
  document.getElementById('view-gallery').style.display = tab==='gallery'?'block':'none';
  if (tab === 'gallery') renderGallery();
}

function renderGallery() {
  const empty = document.getElementById('gallery-empty-state');
  const grid = document.getElementById('gallery-photos');
  if (photos.length === 0) { empty.style.display = 'block'; grid.style.display = 'none'; return; }
  empty.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = '';
  photos.forEach(function(p) {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.style.cssText = 'aspect-ratio:3/4;position:relative;overflow:hidden;border-radius:10px;border:1.5px solid transparent;cursor:pointer;transition:border-color 0.15s;background:var(--bg)';
    d.onclick = function() { selectedId = p.id; switchTab('upload'); renderRecent(); renderDetail(p); };
    d.innerHTML = '<img src="' + p.url + '" style="width:100%;height:100%;object-fit:cover;display:block" alt="foto">'
      + '<div style="position:absolute;bottom:0;left:0;right:0;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,0.5))">'
      + '<div style="font-size:10px;color:#fff;font-family:DM Mono,monospace">#' + p.id + '</div>'
      + '<span class="thumb-badge ' + (p.scanned?'thumb-done':'thumb-wait') + '" style="position:static;margin-top:2px;display:inline-block">' + (p.scanned?'✓ Listo':'Pendiente') + '</span>'
      + '</div>';
    grid.appendChild(d);
  });
}

var toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

initSupabase();
</script>
</body>
</html>
